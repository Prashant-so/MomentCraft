name: MomentCraft
version: '${version}'
main: dev.momentcraft.plugin.MomentCraftPlugin
api-version: '1.21'
author: YOUR_NAME_HERE
description: Detects notable gameplay moments and turns them into short cinematic clips.
website: https://github.com/YOUR_USERNAME/MomentCraft

load: POSTWORLD

commands:
  momentcraft:
    description: Main MomentCraft command.
    usage: /momentcraft <reload|version|wand|zone|performance|moments>
    aliases: [mc]

permissions:
  momentcraft.admin.reload:
    description: Allows reloading the MomentCraft configuration.
    default: op
  momentcraft.admin.zone:
    description: Allows using the wand and managing capture zones.
    default: op
  momentcraft.admin.notify:
    description: Receives moment-detected notifications and can view moment history.
    default: op
