# MomentCraft configuration
# This file grows as features land. Phase 7 adds job export: a detected
# moment gets written as a JSON file for an external worker to pick up.

config-version: 1

general:
  debug: false

zones:
  wand-material: STICK

capture:
  sample-interval-ticks: 10
  buffer-seconds: 15

performance:
  throttle-below-tps: 18.0
  pause-below-tps: 15.0
  min-free-memory-percent: 10.0

scoring:
  threshold: 55
  cooldown-seconds: 30
  nearby-player-radius: 20.0
  nearby-player-cap: 3
  weights:
    base-kill: 5
    base-boss-kill: 50
    low-health-bonus-max: 30
    killstreak-per-kill: 8
    danger-bonus: 10
    nearby-player-bonus: 4

jobs:
  # Job files older than this get deleted automatically, in case a
  # worker isn't running to consume them.
  max-age-minutes: 60
  # Hard cap on how many job files can exist at once, regardless of age —
  # oldest gets deleted first if this is exceeded. Bounded storage.
  max-count: 200

