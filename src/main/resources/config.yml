# MomentCraft configuration
# This file grows as features land. Phase 4 adds the capture buffer:
# a rolling window of player state inside active zones, sampled at a
# low, configurable rate so it stays cheap even with several zones active.

config-version: 1

general:
  debug: false

zones:
  wand-material: STICK

capture:
  # How often (in server ticks, 20 = 1 second) to sample players inside
  # active zones. Lower = more precise lead-up footage later, higher cost.
  sample-interval-ticks: 10
  # How many seconds of history to keep per zone before old snapshots
  # get dropped.
  buffer-seconds: 15

